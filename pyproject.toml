[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-neuron-steering"
version = "0.1.0"
description = "Two-pass dense SwiGLU neuron steering experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers"]

[tool.setuptools.packages.find]
include = ["neuron_steering*"]
